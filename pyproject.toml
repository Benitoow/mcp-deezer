[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-deezer"
version = "2.0.0"
description = "Unofficial Deezer MCP server for playlists, favorites, search, and music discovery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Benjamin Leleu"},
]
keywords = ["mcp", "deezer", "music", "ai", "agent", "playlist", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# `mcp` 2.0/2.1 rejected array structured content in a way that broke several tools:
# pin to the 2.3 line and test against the newest allowed version in CI.
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "mcp>=2.3.0,<3.0.0",
    "deezer-python-gql>=0.24.0,<0.25.0",
    "jsonschema>=4.20.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Benitoow/mcp-deezer"
Repository = "https://github.com/Benitoow/mcp-deezer"
Issues = "https://github.com/Benitoow/mcp-deezer"

[project.scripts]
mcp-deezer = "mcp_deezer.server:run"

[build.targets.wheel]
packages = ["mcp_deezer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:deezer_python_gql.*",
]

[tool.coverage.run]
branch = true
source = ["mcp_deezer"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["mcp_deezer"]
strict = true
warn_unreachable = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = ["deezer_python_gql.*", "jsonschema.*"]
ignore_missing_imports = true
