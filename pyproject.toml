[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-deezer"
version = "1.0.0"
description = "Deezer MCP server for AI agents — manage playlists, favorites, search, and discover music via ARL cookie auth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Benjamin Leleu"},
]
keywords = ["mcp", "deezer", "music", "ai", "agent", "playlist", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "deezer-python-gql>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/Benitoow/mcp-deezer"
Repository = "https://github.com/Benitoow/mcp-deezer"
Issues = "https://github.com/Benitoow/mcp-deezer/issues"

[project.scripts]
mcp-deezer = "mcp_deezer.server:run"

[build.targets.wheel]
packages = ["mcp_deezer"]
