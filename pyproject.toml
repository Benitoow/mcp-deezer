[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-deezer"
version = "1.0.0"
description = "Unofficial Deezer MCP server for playlists, favorites, search, and music discovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Benjamin Leleu"},
]
keywords = ["mcp", "deezer", "music", "ai", "agent", "playlist", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "deezer-python-gql>=0.17.0,<0.21.0",
    "jsonschema>=4.20.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "twine>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Benitoow/mcp-deezer"
Repository = "https://github.com/Benitoow/mcp-deezer"
Issues = "https://github.com/Benitoow/mcp-deezer/issues"

[project.scripts]
mcp-deezer = "mcp_deezer.server:run"

[build.targets.wheel]
packages = ["mcp_deezer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
