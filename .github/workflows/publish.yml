name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # trusted publishing: no long-lived PyPI token in the repo

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-deezer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"].removeprefix("v")
          assert tag == version, f"tag {tag} does not match version {version}"
          PY
      - name: Build distributions
        run: python -m pip install build && python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
